spring:
  threads:
    virtual:
      enabled: true
  application:
    name: nforaprazo

  datasource:
    url: jdbc:postgresql://localhost:5432/nfora_prazo_dev
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:dev}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration
    validate-on-migrate: false

  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:2525}
    username: ${MAIL_USER:noreply@sistema.local}
    password: ${MAIL_PASS:}
    properties:
      mail:
        smtp:
          auth: ${MAIL_AUTH:false}
          starttls:
            enable: ${MAIL_STARTTLS:false}
          ssl:
            trust: ${MAIL_SSL_TRUST:*}

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

  thymeleaf:
    cache: false

management:
  endpoints:
    web:
      exposure:
        include: health, metrics, info
  endpoint:
    health:
      show-details: when_authorized

file:
  upload-dir: ${FILE_UPLOAD_DIR:uploads}

server:
  port: 8080

logging:
  level:
    com.sistema.nforaprazo: DEBUG
    org.springframework.security: INFO
