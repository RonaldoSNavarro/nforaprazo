<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security" lang="pt-BR">
<head th:replace="~{fragments/layout :: head('Observabilidade')}">
    <title>Observabilidade</title>
</head>
<body class="font-body bg-slate-950 min-h-screen text-slate-100">
    <!-- Sidebar -->
    <div th:replace="~{fragments/layout :: sidebar}"></div>

    <!-- Main Content -->
    <div class="min-h-screen transition-all duration-300" id="main-content">
        <!-- Topbar -->
        <div th:replace="~{fragments/layout :: topbar}"></div>

        <main class="p-6 lg:p-8 space-y-8 max-w-7xl mx-auto">
            
            <!-- Page Title -->
            <div class="flex flex-col md:flex-row md:items-center justify-between gap-4">
                <div>
                    <h1 class="font-display text-2xl lg:text-3xl font-bold bg-gradient-to-r from-slate-50 to-slate-350 bg-clip-text text-transparent">
                        Observabilidade e Saúde do Sistema
                    </h1>
                    <p class="text-slate-400 text-sm mt-1">Métricas em tempo real da aplicação, banco de dados e servidor.</p>
                </div>
                <div>
                    <button onclick="carregarDados()" class="px-4 py-2 bg-slate-800 hover:bg-slate-700 text-slate-200 text-sm font-semibold rounded-xl flex items-center gap-2 transition-colors">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15" />
                        </svg>
                        Atualizar
                    </button>
                </div>
            </div>

            <div id="loader" class="flex justify-center items-center py-12">
                <svg class="animate-spin h-8 w-8 text-amber-500" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                    <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                    <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
                </svg>
            </div>

            <div id="dashboard-content" class="hidden space-y-8">
                <!-- Health Status Cards -->
                <h2 class="text-lg font-bold text-slate-300 border-b border-slate-800 pb-2">Status dos Componentes</h2>
                <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-6" id="health-cards">
                    <!-- Cards will be injected here via JS -->
                </div>

                <!-- Metrics Overview -->
                <h2 class="text-lg font-bold text-slate-300 border-b border-slate-800 pb-2">Métricas do Servidor (JVM)</h2>
                <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-6">
                    
                    <!-- Uptime Card -->
                    <div class="bg-slate-900 border border-slate-800 rounded-2xl p-5 shadow-xl card-hover">
                        <p class="text-xs font-semibold text-slate-500 uppercase tracking-wider mb-2">Uptime da Aplicação</p>
                        <p class="text-2xl font-bold text-slate-100" id="metric-uptime">--</p>
                    </div>

                    <!-- CPU Usage -->
                    <div class="bg-slate-900 border border-slate-800 rounded-2xl p-5 shadow-xl card-hover">
                        <p class="text-xs font-semibold text-slate-500 uppercase tracking-wider mb-2">Uso de CPU (Sistema)</p>
                        <p class="text-2xl font-bold text-amber-400" id="metric-cpu">-- %</p>
                    </div>

                    <!-- Memory Usage -->
                    <div class="bg-slate-900 border border-slate-800 rounded-2xl p-5 shadow-xl card-hover relative overflow-hidden">
                        <p class="text-xs font-semibold text-slate-500 uppercase tracking-wider mb-2">Memória Usada (JVM)</p>
                        <p class="text-2xl font-bold text-slate-100" id="metric-memory">-- MB</p>
                        <div class="absolute bottom-0 left-0 h-1 bg-slate-800 w-full">
                            <div id="memory-bar" class="h-full bg-emerald-500" style="width: 0%"></div>
                        </div>
                    </div>

                    <!-- Active Threads -->
                    <div class="bg-slate-900 border border-slate-800 rounded-2xl p-5 shadow-xl card-hover">
                        <p class="text-xs font-semibold text-slate-500 uppercase tracking-wider mb-2">Threads Ativas</p>
                        <p class="text-2xl font-bold text-slate-100" id="metric-threads">--</p>
                    </div>

                </div>
            </div>

        </main>
    </div>

    <!-- Scripts -->
    <div th:replace="~{fragments/layout :: scripts}"></div>

    <script>
        document.addEventListener("DOMContentLoaded", () => {
            carregarDados();
        });

        async function carregarDados() {
            document.getElementById('loader').classList.remove('hidden');
            document.getElementById('dashboard-content').classList.add('hidden');
            
            try {
                // Fetch Health
                const resHealth = await fetch('/actuator/health');
                const healthData = await resHealth.json();
                renderHealth(healthData);

                // Fetch Metrics
                await fetchAndRenderMetric('process.uptime', formatUptime, 'metric-uptime');
                await fetchAndRenderMetric('system.cpu.usage', (val) => (val * 100).toFixed(2) + ' %', 'metric-cpu');
                await fetchAndRenderMetric('jvm.threads.live', (val) => val, 'metric-threads');
                
                // Fetch Memory
                const memUsedRes = await fetch('/actuator/metrics/jvm.memory.used');
                const memUsedData = await memUsedRes.json();
                const memMaxRes = await fetch('/actuator/metrics/jvm.memory.max');
                const memMaxData = await memMaxRes.json();
                
                if (memUsedData.measurements && memMaxData.measurements) {
                    const usedBytes = memUsedData.measurements[0].value;
                    const maxBytes = memMaxData.measurements[0].value;
                    const usedMb = (usedBytes / (1024 * 1024)).toFixed(0);
                    const maxMb = (maxBytes / (1024 * 1024)).toFixed(0);
                    document.getElementById('metric-memory').innerText = usedMb + ' MB / ' + maxMb + ' MB';
                    
                    const percent = Math.min((usedBytes / maxBytes) * 100, 100);
                    const memoryBar = document.getElementById('memory-bar');
                    memoryBar.style.width = percent + '%';
                    
                    if (percent > 85) memoryBar.className = 'h-full bg-red-500';
                    else if (percent > 65) memoryBar.className = 'h-full bg-amber-500';
                    else memoryBar.className = 'h-full bg-emerald-500';
                }

            } catch (err) {
                console.error("Erro ao carregar dados do Actuator", err);
            } finally {
                document.getElementById('loader').classList.add('hidden');
                document.getElementById('dashboard-content').classList.remove('hidden');
            }
        }

        async function fetchAndRenderMetric(metricName, formatterFn, elementId) {
            try {
                const res = await fetch('/actuator/metrics/' + metricName);
                if (res.ok) {
                    const data = await res.json();
                    if (data.measurements && data.measurements.length > 0) {
                        const val = data.measurements[0].value;
                        document.getElementById(elementId).innerText = formatterFn(val);
                    }
                }
            } catch (err) {
                console.error("Erro metric " + metricName, err);
            }
        }

        function formatUptime(seconds) {
            const h = Math.floor(seconds / 3600);
            const m = Math.floor((seconds % 3600) / 60);
            return h + 'h ' + m + 'm';
        }

        function renderHealth(healthData) {
            const container = document.getElementById('health-cards');
            container.innerHTML = ''; // clear

            // Main App Status
            container.innerHTML += createHealthCard('Aplicação Principal', healthData.status, 'Status geral');

            // Iterate over components if they exist
            if (healthData.components) {
                if (healthData.components.db) {
                    const dbDetails = healthData.components.db.details ? healthData.components.db.details.database : 'Banco de Dados';
                    container.innerHTML += createHealthCard('PostgreSQL', healthData.components.db.status, dbDetails);
                }
                
                if (healthData.components.diskSpace) {
                    let details = 'Espaço em Disco';
                    if (healthData.components.diskSpace.details) {
                        const freeGb = (healthData.components.diskSpace.details.free / (1024*1024*1024)).toFixed(1);
                        details = freeGb + ' GB Livre';
                    }
                    container.innerHTML += createHealthCard('Disco Local', healthData.components.diskSpace.status, details);
                }

                if (healthData.components.mail) {
                    let details = healthData.components.mail.details ? healthData.components.mail.details.location : 'Servidor SMTP';
                    container.innerHTML += createHealthCard('Servidor de E-mail', healthData.components.mail.status, details);
                }
            }
        }

        function createHealthCard(title, status, subtitle) {
            const isUp = status === 'UP';
            const colorClass = isUp ? 'text-emerald-400 bg-emerald-500/10 border-emerald-500/20' : 'text-red-400 bg-red-500/10 border-red-500/20';
            const icon = isUp 
                ? '<svg class="w-6 h-6 text-emerald-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z" /></svg>'
                : '<svg class="w-6 h-6 text-red-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z" /></svg>';

            return `
                <div class="bg-slate-900 border border-slate-800 rounded-2xl p-5 shadow-xl flex items-center gap-4 card-hover">
                    <div class="flex-shrink-0">
                        ${icon}
                    </div>
                    <div>
                        <p class="text-sm font-bold text-slate-200">${title}</p>
                        <p class="text-xs text-slate-500 truncate" title="${subtitle}">${subtitle}</p>
                    </div>
                    <div class="ml-auto">
                        <span class="px-2 py-1 text-[10px] font-bold rounded-full border ${colorClass}">${status}</span>
                    </div>
                </div>
            `;
        }
    </script>
</body>
</html>
