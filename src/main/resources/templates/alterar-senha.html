<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Alterar Senha — NF Fora do Prazo</title>
    <meta name="description" content="Alteração obrigatória de senha temporária do usuário">
    <link rel="stylesheet" th:href="@{/css/fonts.css}">
    <script th:src="@{/js/tailwind.js}"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        display: ['Space Grotesk', 'sans-serif'],
                        body: ['Inter', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    <style>
        @keyframes fade-in { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .fade-in { animation: fade-in 0.5s ease-out; }
        .bg-orb {
            position: fixed;
            border-radius: 50%;
            filter: blur(80px);
            opacity: 0.12;
            pointer-events: none;
        }
    </style>
</head>
<body class="font-body bg-slate-950 min-h-screen flex items-center justify-center relative overflow-hidden text-slate-100">
    <!-- Background orbs -->
    <div class="bg-orb w-96 h-96 bg-amber-500 top-[-10%] right-[-5%]"></div>
    <div class="bg-orb w-80 h-80 bg-blue-600 bottom-[-10%] left-[-5%]"></div>

    <div class="w-full max-w-md mx-auto px-6 relative z-10 fade-in">
        <!-- Header -->
        <div class="text-center mb-8">
            <div class="inline-flex items-center justify-center w-14 h-14 rounded-2xl bg-amber-500/10 border border-amber-500/20 mb-4">
                <svg class="w-6 h-6 text-amber-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"/>
                </svg>
            </div>
            <h1 class="font-display text-2xl font-bold text-slate-50">Alteração de Senha</h1>
            <p class="text-slate-400 text-sm mt-1">Sua conta exige a definição de uma nova senha de acesso.</p>
        </div>

        <!-- Card -->
        <div class="bg-slate-800/80 backdrop-blur-sm border border-slate-700 rounded-2xl p-8 shadow-2xl shadow-black/20">
            <!-- Alert Error -->
            <div th:if="${error}" class="mb-5 p-3.5 rounded-xl bg-red-500/10 border border-red-500/30 text-red-400 text-sm flex items-start gap-2.5">
                <svg class="w-4.5 h-4.5 text-red-400 mt-0.5 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"/>
                </svg>
                <span th:text="${error}">Erro genérico</span>
            </div>

            <!-- Form -->
            <form th:action="@{/alterar-senha}" method="post" class="space-y-5">
                <div>
                    <label for="novaSenha" class="block text-sm font-medium text-slate-300 mb-1.5">Nova Senha</label>
                    <input type="password" id="novaSenha" name="novaSenha" required autofocus
                           placeholder="Mínimo 6 caracteres"
                           class="w-full px-4 py-2.5 bg-slate-900/50 border border-slate-600 rounded-xl text-slate-50 placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-amber-500/50 focus:border-amber-500 transition-all text-sm">
                </div>

                <div>
                    <label for="confirmarSenha" class="block text-sm font-medium text-slate-300 mb-1.5">Confirmar Nova Senha</label>
                    <input type="password" id="confirmarSenha" name="confirmarSenha" required
                           placeholder="Confirme sua nova senha"
                           class="w-full px-4 py-2.5 bg-slate-900/50 border border-slate-600 rounded-xl text-slate-50 placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-amber-500/50 focus:border-amber-500 transition-all text-sm">
                </div>

                <button type="submit"
                        class="w-full py-3 px-4 bg-gradient-to-r from-amber-500 to-amber-600 hover:from-amber-600 hover:to-amber-700 text-slate-950 font-bold rounded-xl transition-all duration-200 focus:outline-none focus:ring-2 focus:ring-amber-500/50 shadow-lg shadow-amber-500/20 hover:shadow-amber-500/30 text-sm">
                    Atualizar Senha &amp; Entrar
                </button>
            </form>
        </div>

        <!-- Footer -->
        <p class="text-center text-slate-600 text-xs mt-6">
            &copy; 2026 Alianca Navegacao e Logistica
        </p>
    </div>
</body>
</html>
