<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="pt-BR">
<head th:replace="~{fragments/layout :: head('Registrar Pagamento')}">
    <title>Registrar Pagamento SEFAZ</title>
</head>
<body class="font-body bg-slate-950 min-h-screen">
    <div th:replace="~{fragments/layout :: sidebar}"></div>

    <div class="min-h-screen transition-all duration-300" id="main-content">
        <div th:replace="~{fragments/layout :: topbar}"></div>

        <main class="p-6 lg:p-8">
            <div class="mb-8">
                <a th:href="@{/descarga/pendentes}" class="inline-flex items-center gap-2 text-sm text-slate-400 hover:text-amber-500 transition-colors mb-4">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"/></svg>
                    Voltar para Pendentes
                </a>
                <h1 class="font-display text-2xl font-bold text-slate-50">Registrar Pagamento (Desembaraço)</h1>
                <p class="text-slate-400 mt-1">CT-e: <span class="font-mono text-amber-500 font-semibold" th:text="${cte.chaveAcesso ?: cte.nomeOriginalArquivo}">Chave</span></p>
            </div>

            <!-- Alertas -->
            <div th:if="${erro}" class="mb-6 p-4 rounded-xl bg-red-500/10 border border-red-500/30 text-red-400 flex items-start gap-3">
                <svg class="w-5 h-5 flex-shrink-0 mt-0.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"/></svg>
                <span th:text="${erro}">Erro</span>
            </div>

            <form th:action="@{/descarga/pagamento}" method="post" enctype="multipart/form-data" class="bg-slate-800 border border-slate-700 rounded-2xl p-6 lg:p-8 shadow-xl max-w-4xl" id="paymentForm">
                <input type="hidden" name="cteId" th:value="${cte.id}" />

                <div class="grid grid-cols-1 md:grid-cols-2 gap-6 mb-8">
                    <!-- Valor -->
                    <div>
                        <label class="block text-sm font-medium text-slate-300 mb-2">Valor da Multa (R$)</label>
                        <input type="number" step="0.01" min="0" name="valorMulta" required class="w-full bg-slate-900 border border-slate-700 rounded-lg px-4 py-2.5 text-slate-200 focus:ring-2 focus:ring-amber-500 focus:border-amber-500 transition-all outline-none" placeholder="0.00" />
                    </div>
                    <!-- Data Pagamento -->
                    <div>
                        <label class="block text-sm font-medium text-slate-300 mb-2">Data do Pagamento</label>
                        <input type="date" name="dataPagamento" required class="w-full bg-slate-900 border border-slate-700 rounded-lg px-4 py-2.5 text-slate-200 focus:ring-2 focus:ring-amber-500 focus:border-amber-500 transition-all outline-none" />
                    </div>
                </div>

                <div class="space-y-6">
                    <h3 class="text-lg font-semibold text-slate-200 border-b border-slate-700 pb-2">Documentação Fiscal</h3>
                    
                    <div class="grid grid-cols-1 lg:grid-cols-2 gap-6">
                        <!-- DAR -->
                        <div class="bg-slate-900/50 p-4 rounded-xl border border-slate-700">
                            <label class="block text-sm font-medium text-slate-300 mb-1">DAR (Guia) *</label>
                            <p class="text-xs text-slate-500 mb-3">Documento de Arrecadação gerado</p>
                            <input type="file" name="darPdf" accept=".pdf" required class="block w-full text-sm text-slate-400 file:mr-4 file:py-2 file:px-4 file:rounded-full file:border-0 file:text-sm file:font-semibold file:bg-amber-500/10 file:text-amber-500 hover:file:bg-amber-500/20" />
                        </div>

                        <!-- Comprovante -->
                        <div class="bg-slate-900/50 p-4 rounded-xl border border-slate-700">
                            <label class="block text-sm font-medium text-slate-300 mb-1">Comprovante de Pgto *</label>
                            <p class="text-xs text-slate-500 mb-3">Comprovante bancário</p>
                            <input type="file" name="comprovantePdf" accept=".pdf" required class="block w-full text-sm text-slate-400 file:mr-4 file:py-2 file:px-4 file:rounded-full file:border-0 file:text-sm file:font-semibold file:bg-amber-500/10 file:text-amber-500 hover:file:bg-amber-500/20" />
                        </div>

                        <!-- Auto de Infração (TAX) -->
                        <div class="bg-slate-900/50 p-4 rounded-xl border border-orange-700/40">
                            <label class="block text-sm font-medium text-orange-300 mb-1">Auto de Infração (TAX) *</label>
                            <p class="text-xs text-slate-500 mb-3">Documento disponibilizado pela equipe TAX</p>
                            <input type="file" name="autoInfracaoPdf" accept=".pdf" required class="block w-full text-sm text-slate-400 file:mr-4 file:py-2 file:px-4 file:rounded-full file:border-0 file:text-sm file:font-semibold file:bg-orange-500/10 file:text-orange-400 hover:file:bg-orange-500/20" />
                        </div>

                        <!-- Capa (Opcional) -->
                        <div class="bg-slate-900/50 p-4 rounded-xl border border-slate-700 border-dashed">
                            <label class="block text-sm font-medium text-slate-300 mb-1">Capa (Opcional)</label>
                            <p class="text-xs text-slate-500 mb-3">Documentação auxiliar</p>
                            <input type="file" name="capaPdf" accept=".pdf" class="block w-full text-sm text-slate-400 file:mr-4 file:py-2 file:px-4 file:rounded-full file:border-0 file:text-sm file:font-semibold file:bg-slate-800 file:text-slate-300 hover:file:bg-slate-700" />
                        </div>
                    </div>
                </div>

                <div class="mt-8 flex justify-end">
                    <button type="submit" id="submitBtn" class="px-6 py-2.5 bg-gradient-to-r from-amber-500 to-amber-600 hover:from-amber-600 hover:to-amber-700 text-slate-950 font-semibold rounded-xl transition-all shadow-lg shadow-amber-500/20 disabled:opacity-50 flex items-center gap-2">
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"/></svg>
                        Confirmar Baixa
                    </button>
                </div>
            </form>
        </main>
    </div>

    <div th:replace="~{fragments/layout :: scripts}"></div>
    <script>
        document.getElementById('paymentForm').addEventListener('submit', function() {
            const btn = document.getElementById('submitBtn');
            btn.innerHTML = '<svg class="animate-spin h-5 w-5 text-slate-950" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path></svg> Processando...';
            btn.disabled = true;
        });
    </script>
</body>
</html>
