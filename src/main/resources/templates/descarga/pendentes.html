<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="pt-BR">
<head th:replace="~{fragments/layout :: head('CT-es Pendentes')}">
    <title>Pendentes - Descarga</title>
</head>
<body class="font-body bg-slate-950 min-h-screen">
    <div th:replace="~{fragments/layout :: sidebar}"></div>

    <div class="min-h-screen transition-all duration-300" id="main-content">
        <div th:replace="~{fragments/layout :: topbar}"></div>

        <main class="p-6 lg:p-8">
            <div class="mb-8">
                <h1 class="font-display text-2xl font-bold text-slate-50">CT-es Aguardando Desembaraço</h1>
                <p class="text-slate-400 mt-1">Lista de Conhecimentos de Transporte emitidos fora do prazo pendentes de pagamento na SEFAZ.</p>
            </div>

            <!-- Alertas -->
            <div th:if="${sucesso}" class="mb-6 p-4 rounded-xl bg-green-500/10 border border-green-500/30 text-green-400 flex items-start gap-3">
                <svg class="w-5 h-5 flex-shrink-0 mt-0.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"/></svg>
                <span th:text="${sucesso}">Sucesso</span>
            </div>

            <div class="bg-slate-800 border border-slate-700 rounded-2xl overflow-hidden shadow-xl shadow-black/20">
                <div class="overflow-x-auto">
                    <table class="w-full text-sm text-left text-slate-300">
                        <thead class="text-xs text-slate-400 uppercase bg-slate-900/50 border-b border-slate-700">
                            <tr>
                                <th scope="col" class="px-6 py-4 font-semibold tracking-wider">Chave de Acesso</th>
                                <th scope="col" class="px-6 py-4 font-semibold tracking-wider">Data Upload</th>
                                <th scope="col" class="px-6 py-4 font-semibold tracking-wider text-right">Ação</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:if="${ctes.empty}" class="bg-slate-800 border-b border-slate-700/50">
                                <td colspan="3" class="px-6 py-8 text-center text-slate-500">Nenhum CT-e pendente de desembaraço no momento.</td>
                            </tr>
                            
                            <tr th:each="cte : ${ctes.content}" class="bg-slate-800 border-b border-slate-700/50 hover:bg-slate-700/30 transition-colors">
                                <td class="px-6 py-4 font-medium text-amber-500">
                                    <span th:text="${cte.chaveAcesso ?: 'CHAVE NÃO INFORMADA'}">000</span>
                                    <p class="text-xs text-slate-500 font-mono mt-1" th:text="${cte.nomeOriginalArquivo}">arquivo.pdf</p>
                                </td>
                                <td class="px-6 py-4" th:text="${#temporals.format(cte.dataUpload, 'dd/MM/yyyy HH:mm')}">Data</td>
                                <td class="px-6 py-4 text-right">
                                    <a th:href="@{/descarga/pagamento/{id}(id=${cte.id})}" class="inline-flex items-center gap-2 px-4 py-2 bg-slate-700 hover:bg-slate-600 text-white text-xs font-semibold rounded-lg transition-colors border border-slate-600">
                                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 9V7a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2m2 4h10a2 2 0 002-2v-6a2 2 0 00-2-2H9a2 2 0 00-2 2v6a2 2 0 002 2zm7-5a2 2 0 11-4 0 2 2 0 014 0z"/></svg>
                                        Registrar Baixa
                                    </a>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </main>
    </div>
    <div th:replace="~{fragments/layout :: scripts}"></div>
</body>
</html>
