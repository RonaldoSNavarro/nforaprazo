<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Erro — NF Fora do Prazo</title>
    <link rel="stylesheet" th:href="@{/css/fonts.css}">
    <script th:src="@{/js/tailwind.js}"></script>
    <script>
        tailwind.config = { theme: { extend: { fontFamily: { display: ['Space Grotesk', 'sans-serif'], body: ['Inter', 'sans-serif'] } } } }
    </script>
</head>
<body class="font-body bg-slate-950 min-h-screen flex items-center justify-center">
    <div class="text-center px-6">
        <div class="inline-flex items-center justify-center w-20 h-20 rounded-2xl bg-red-500/10 border border-red-500/20 mb-6">
            <svg class="w-10 h-10 text-red-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"/>
            </svg>
        </div>
        <h1 class="font-display text-3xl font-bold text-slate-50 mb-2">Erro Inesperado</h1>
        <p class="text-slate-400 mb-6" th:text="${mensagem != null ? mensagem : 'Ocorreu um erro inesperado. Tente novamente mais tarde.'}">Ocorreu um erro inesperado.</p>
        <a href="/home" class="inline-flex items-center gap-2 px-5 py-2.5 bg-slate-800 border border-slate-700 rounded-xl text-slate-300 hover:text-slate-50 hover:border-slate-600 transition-all text-sm">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"/></svg>
            Voltar ao Inicio
        </a>
    </div>
</body>
</html>
